<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Preguntas de Opción Múltiple</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        #question-container {
            margin: 20px auto;
            max-width: 600px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        button {
            padding: 10px 20px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .option {
            display: block;
            margin: 10px 0;
            cursor: pointer;
        }
		button#playPauseButton {
    right: 20px;
    position: absolute;
    top: 0;
}
		img#buttonImage {
    width: 20px;
}
	img#buttonImage {
    width: 20px;
}
		.button#playPauseButton {
    right: 20px;
    position: absolute;
    top: 0;
    width: auto;
    height: auto;
    padding: 7px 7px 4px;
    border-radius: 50%;
    border: none;
    background-color: #ffffff;
}button#playPauseButton {
    right: 20px;
    position: absolute;
    top: 0;
    width: auto;
    height: auto;
    padding: 7px 7px 4px;
    border-radius: 50%;
    border: none;
    background-color: #ffffff;
}
    </style>
</head>
<body>
	<audio id="miAudio" autoplay muted>
        <source src="musica-preguntas.mp4" type="audio/mp4">
        Tu navegador no soporta el elemento de audio.
    </audio>
    <button id="playPauseButton" onclick="togglePlayPause()">
        <img id="buttonImage" src="sin-sonido.png" alt="Reproducir" width="50">
    </button>
    <h1>Juego de Preguntas de Opción Múltiple</h1>
    <div id="question-container">
        <p id="question">Cargando preguntas...</p>
        <div id="options"></div>
        <button id="next-button" onclick="showNextQuestion()" style="display: none;">Siguiente pregunta</button>
    </div>

    <script>
        let questions = [];
        let currentQuestionIndex = 0;
        let currentCorrectAnswer = '';

        // Función para cargar y procesar el XML
        async function loadQuestions() {
            try {
                const response = await fetch('questions.xml');
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'application/xml');

                // Obtener todas las preguntas
                questions = Array.from(xmlDoc.getElementsByTagName('question'));

                // Obtener 10 preguntas aleatorias
                questions = getRandomItems(questions, 10);

                // Mostrar la primera pregunta
                showNextQuestion();
            } catch (error) {
                console.error('Error al cargar el XML:', error);
                document.getElementById('question').textContent = 'Error al cargar las preguntas.';
            }
        }

        // Función para obtener elementos aleatorios de una matriz
        function getRandomItems(arr, num) {
            const shuffled = arr.sort(() => 0.5 - Math.random());
            return shuffled.slice(0, num);
        }

        // Función para mostrar la siguiente pregunta
        function showNextQuestion() {
            if (currentQuestionIndex < questions.length) {
                const question = questions[currentQuestionIndex];
                const questionText = question.getElementsByTagName('text')[0].textContent;
                const options = Array.from(question.getElementsByTagName('option'));
                currentCorrectAnswer = question.getElementsByTagName('correct')[0].textContent;

                // Mostrar la pregunta
                document.getElementById('question').textContent = questionText;

                // Mostrar las opciones
                const optionsContainer = document.getElementById('options');
                optionsContainer.innerHTML = '';
                options.forEach(option => {
                    const optionElement = document.createElement('button');
                    optionElement.className = 'option';
                    optionElement.textContent = option.textContent;
                    optionElement.onclick = () => checkAnswer(optionElement);
                    optionsContainer.appendChild(optionElement);
                });

                // Mostrar el botón de siguiente pregunta si estaba oculto
                document.getElementById('next-button').style.display = 'none';
            } else {
                document.getElementById('question').textContent = '¡Has respondido todas las preguntas!';
                document.getElementById('options').innerHTML = '';
                document.getElementById('next-button').style.display = 'none';
            }

            currentQuestionIndex++;
        }

        // Función para verificar la respuesta seleccionada
        function checkAnswer(selectedOption) {
            const allOptions = document.querySelectorAll('.option');
            allOptions.forEach(option => {
                option.disabled = true;
                if (option.textContent === currentCorrectAnswer) {
                    option.style.backgroundColor = 'green';
                } else {
                    option.style.backgroundColor = 'red';
                }
            });

            // Mostrar el botón de siguiente pregunta
            document.getElementById('next-button').style.display = 'inline-block';
        }

        // Cargar las preguntas cuando se cargue la página
        window.onload = loadQuestions;
		const audio = document.getElementById('miAudio');
        const button = document.getElementById('playPauseButton');
        
        
        
        audio.muted = false;

        function togglePlayPause() {
            if (audio.paused) {
                audio.play();
                buttonImage.src = 'sonido.png';
                buttonImage.alt = 'Pausar';
            } else {
                audio.pause();
                buttonImage.src = 'sin-sonido.png';
                buttonImage.alt = 'Reproducir';
            }
        }

        // Iniciar automáticamente la reproducción y ajustar la imagen del botón
        audio.addEventListener('play', function() {
            buttonImage.src = 'sonido.png';
            buttonImage.alt = 'Pausar';
        });

        audio.addEventListener('pause', function() {
            buttonImage.src = 'sin-sonido.png';
            buttonImage.alt = 'Reproducir';
        });
        
        // Intentar la reproducción automática y manejar la posible falla
        audio.play().catch(function(error) {
            buttonImage.src = 'sin-sonido.png';
            buttonImage.alt = 'Reproducir';
        });
    </script>
</body>
</html>
